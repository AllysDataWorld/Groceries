
{% extends 'base.html' %}

{% block header %}
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
{% endblock %}

{% block body %}

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"
            integrity="sha384-tsQFqpEReu7ZLhBV2VZlAu7zcOV+rXbYlF2cqB8txI/8aZajjp4Bqd+V6D5IgvKT"
            crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>


<script>
    $(document).ready(function(){
      // load function
      function load_data(query, exact)
      {
       $.ajax({
        url:"/ajaxlivesearch",
        method:"POST",
        data:{
            query: query,
            exact: exact  // Send exact flag
        },
        success:function(data)
        {
          $('#result').html(data);
          $("#result").append(data.htmlresponse);
        }
       });
      }

      // Initial load
      load_data('', 'false');

      // Fuzzy search on keyup
      $('#search_text').keyup(function(){
        var search = $(this).val();
        if(search != ''){
          load_data(search, 'false');
        } else {
          load_data('', 'false');
        }
      });

      // Exact search button click
      $('#exact_search_btn').click(function(){
        var search = $('#search_text').val();
        if(search != ''){
          load_data(search, 'true');  // Pass true for exact search
        } else {
          alert('Please enter a search term');
        }
      });

    });
</script>



<div class="container search-table">
<p><h2 align="center">Search the Items database</h2></p>
            <div class="search-box">
                <div class="row">
                    <div class="col-md-3">
                        <h5>Search All Fields</h5>
                    </div>
                    <div class="col-md-7">
                        <input type="text" name="search_text" id="search_text" class="form-control" placeholder="Search all fields e.g. HTML">
                    </div>
                    <div class="col-md-2">
                        <button id="exact_search_btn" class="btn btn-primary">Exact Match</button>
                    </div>
                </div>
            </div>
   <div id="result"></div>
</div>


<style>
    .search-table{
        padding: 10%;
        margin-top: -6%;
    }
    .search-box{
        background: #c1c1c1;
        border: 1px solid #ababab;
        padding: 3%;
    }
    .search-box input:focus{
        box-shadow:none;
        border:2px solid #eeeeee;
    }
    .search-list{
        background: #fff;
        border: 1px solid #ababab;
        border-top: none;
    }
    .search-list h3{
        background: #eee;
        padding: 3%;color:#fe6f41;
        margin-bottom: 0%;
    }
</style>
{% endblock %}
